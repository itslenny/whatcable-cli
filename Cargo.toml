[package]
name = "whatcable"
version = "0.1.0"
edition = "2021"
authors = ["Lenny Urbanowski"]
description = "CLI tool to show USB-C cable capabilities on macOS (based on WhatCable by Darryl Morley)"
license = "MIT"
repository = "https://github.com/itslenny/whatcable-cli"
default-run = "whatcable"

[lib]
name = "whatcable"
path = "src/lib.rs"

[[bin]]
name = "whatcable"
path = "src/main.rs"

[[bin]]
name = "export-fixtures"
path = "src/bin/export_fixtures.rs"

[dependencies]
plist = "1.7"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
core-foundation = "0.9"
io-kit-sys = "0.4"
regex = "1.10"
